# ==============================================================================
# Vision Technolabs - Production Nginx Reverse Proxy Configuration
# ==============================================================================
# Next.js Node.js Server: 127.0.0.1:3000
# Features: HTTP/2, Gzip/Brotli, Static Asset Caching, WebSocket proxying

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name visiontechnolabs.com www.visiontechnolabs.com;

    location / {
        return 301 https://visiontechnolabs.com$request_uri;
    }
}

# Canonical domain redirect (www to non-www over HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.visiontechnolabs.com;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/visiontechnolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visiontechnolabs.com/privkey.pem;

    return 301 https://visiontechnolabs.com$request_uri;
}

# Primary HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name visiontechnolabs.com;

    # SSL Configuration (Modern TLS Profile)
    ssl_certificate /etc/letsencrypt/live/visiontechnolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visiontechnolabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression Configuration (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        image/x-icon;

    # Optional: Brotli Compression (if ngx_brotli module is compiled)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Next.js Build-Hashed Chunks & Static Assets (Immutable Cache)
    # Next.js generates content-hashed filenames for /_next/static/
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public Static Asset Folders (Long Cache with Stale-While-Revalidate)
    # Filenames in public/ are not hashed, so stale-while-revalidate allows safe background updates
    location ~* ^/(images|app_images|logo)/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # Favicon and Robots
    location = /favicon.ico {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        expires 1d;
        access_log off;
    }

    # Dynamic Pages and API Routes (Proxy to Next.js App Server)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client Identity & Host Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts and Buffers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
